[package]
name = "velosearch"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "An OpenSearch-compatible search server, on VeloCore"
repository = "https://github.com/codefin-lab/velosearch"
readme = "README.md"
keywords = ["search", "opensearch", "elasticsearch", "server"]
categories = ["database-implementations"]

[lib]
name = "velosearch"
path = "src/lib.rs"

[[bin]]
name = "velosearch"
path = "src/main.rs"

[dependencies]
postcard = { version = "1.0", features = ["alloc"] }
# VeloCore is the search library this is built on: a fork of tantivy that
# lives at github.com/codefin-lab/velocore, so it can be patched where the
# engine needs it to behave the way OpenSearch does. Pinned to a commit, so a
# build is the same build tomorrow. See docs/velocore.md.
#
# To work on the fork and this together, clone it beside this repo and add:
#
#     [patch."https://github.com/codefin-lab/velocore"]
#     velocore = { path = "../velocore" }
#     velocore-common = { path = "../velocore/common" }
velocore = { git = "https://github.com/codefin-lab/velocore", rev = "57fcb12c27736f95b98577f64616879b5c811b0b", features = ["zstd-compression"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
parking_lot = "0.12"
regex = "1"
sha1 = "0.10"
flate2 = "1"
base64 = "0.22"
serde_yaml = "0.9"
bcrypt = "0.15"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.13"
x509-parser = "0.16"
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "service"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
tower = { version = "0.5", features = ["util"] }
fancy-regex = "0.13"
md5 = "0.7"
sha3 = "0.10"
percent-encoding = "2"
sha2 = "0.10"
# request signing for the object-store repositories
hmac = "0.12"
rayon = "1"
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", features = ["extended"] }
# The MaxMind database format, for the geoip ingest processor. The databases
# themselves are not vendored here: see docs/geoip.md.
maxminddb = "0.30"
# The phonetic encoders, a port of the Apache commons-codec ones OpenSearch
# uses, so a token encoded here is the token encoded there.
rphonetic = { version = "4", features = ["embedded"] }
# Google's libphonenumber, for the `phone` analyzers: a number is read the
# same way OpenSearch's plugin reads it.
phonenumber = "0.3"
# The character sets a text, HTML or RTF file may be written in, for the
# attachment processor. Already built as a dependency of other crates; the
# language detector and the file formats themselves are read in
# src/ingest/attachment/.
encoding_rs = "0.8"
# The OLE2 container the older Office formats are written in. What is inside
# it -- the Word streams -- is read in src/ingest/attachment/office.rs.
cfb = "0.14"
velocore-fst = { package = "tantivy-fst", version = "0.5" }
velocore-common = { git = "https://github.com/codefin-lab/velocore", rev = "57fcb12c27736f95b98577f64616879b5c811b0b" }
icu_normalizer = "2.3.0"
icu_segmenter = { version = "2.3.0", features = ["auto"] }
icu_properties = "2.3.0"
# The Japanese, Korean and Chinese dictionaries are built into the binary, the
# way OpenSearch's kuromoji, nori and smartcn plugins carry theirs. They are
# most of what this binary weighs; a build with `--no-default-features` leaves
# them out, and those three analyzers with them.
lindera = { version = "6.0.0", features = [
    "embed-ipadic",
    "embed-ko-dic",
    "embed-cc-cedict",
], optional = true }
jsonwebtoken = "9"
# the cipher on-behalf-of tokens carry their roles under, as the plugin does
aes = "0.8"
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
quick-xml = "0.42.0"
rsa = { version = "0.9", features = ["sha2", "sha1"] }
form_urlencoded = "1.2.2"

[features]
default = ["cjk"]
# the dictionaries for the scripts that are read rather than split
cjk = ["dep:lindera"]

[profile.release]
opt-level = 3
lto = "thin"





