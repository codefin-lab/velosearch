name: ci

on:
  push:
    branches: [main]
  pull_request:
  # the release workflow runs these same gates on the tag rather than a
  # copy of two of them
  workflow_call:

jobs:
  # What the three hundred crates under this build are: whether one of them
  # has a published advisory, what licence each carries, and whether any of
  # them comes from somewhere nobody agreed to. Nothing was reading any of
  # that. `deny.toml` holds the policy and the reasons.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.0'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Advisories, licences and sources
        run: cargo deny --all-features check

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the version is pinned in rust-toolchain.toml, so the gate means the
      # same thing here as it does on a laptop
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.0'
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Unit tests
        run: cargo test --release

      - name: Lint
        run: |
          cargo fmt --check
          cargo clippy --release --all-targets -- -D warnings

      # Only the test suite is needed, and it is a small corner of a large
      # repository.
      - name: Fetch OpenSearch's rest-api-spec
        run: |
          git clone --filter=blob:none --sparse --depth 1 \
            https://github.com/opensearch-project/OpenSearch study/OpenSearch
          cd study/OpenSearch
          git sparse-checkout set rest-api-spec/src/main/resources/rest-api-spec

      - name: Install the runner's dependencies
        run: pip install --quiet pyyaml requests

      # what the README claims about endpoints, read rather than remembered
      - name: REST endpoints routed
        run: python3 tools/endpoint_gate.py --missing

      - name: Run the conformance suite
        run: |
          VELOSEARCH_NODE_ATTRS=testattr=test ./target/release/velosearch &
          for i in $(seq 30); do curl -sf localhost:9200/ >/dev/null && break; sleep 1; done
          python3 - <<'PY'
          import pathlib, json
          root = pathlib.Path('study/OpenSearch/rest-api-spec/src/main/resources/rest-api-spec/test')
          files = sorted(str(p.relative_to(root)) for p in root.rglob('*.yml'))
          json.dump({'clean': files}, open('/tmp/every.json', 'w'))
          print(f'{len(files)} files')
          PY
          python3 tools/yaml_runner.py --manifest /tmp/every.json

      # The same suite again, this time against indices on disk rather than in
      # memory: the storage mode a deployment would use.
      - name: Run it again, on disk
        run: |
          pkill -f 'release/velosearch' || true
          sleep 1
          VELOSEARCH_DATA=$RUNNER_TEMP/data VELOSEARCH_NODE_ATTRS=testattr=test \
            ./target/release/velosearch &
          for i in $(seq 30); do curl -sf localhost:9200/ >/dev/null && break; sleep 1; done
          python3 tools/yaml_runner.py --manifest /tmp/every.json

      # The suites above ask for the right answer to a sensible question. These
      # three ask the other kind: what a caller may reach when they may not
      # reach it, what an index holds after a write it refused, and whether the
      # node is still there after a body nobody would write on purpose --
      # three shapes of mistake the suites above cannot see.
      - name: Who may reach what
        run: |
          pkill -f 'release/velosearch' || true
          sleep 1
          python3 tools/auth_matrix.py

      - name: A refused write leaves the document alone
        run: python3 tools/refusal_check.py

      # a document-level filter is only as good as the least careful path
      - name: Document- and field-level security, through every reading path
        run: python3 tools/dls_check.py

      - name: Malformed input at everything that parses
        run: python3 tools/fuzz_check.py --rounds 2000

      # The three ceilings a node has to have before it can be left alone with
      # real traffic: the memory its requests may take, how many of them it
      # runs at once, and how long one of them may walk. Each was reported
      # before it was enforced, so each is checked by putting a node in the
      # state and reading what it answers.
      - name: The memory, the concurrency and the time a request may take
        run: python3 tools/limits_check.py

      # A ceiling an operator cannot see being reached is a ceiling nobody
      # acts on: the exporter is scraped and parsed here the way Prometheus
      # would parse it, and the log is asked to say more than it does by
      # default.
      - name: What an operator can see
        run: python3 tools/metrics_check.py

      # A write is answered once it is recorded and reaches the index at the
      # next commit; what a node does with that record when it starts again is
      # the whole of its durability, and no suite ever restarts a node.
      # A runner is not the machine the baseline was taken on, so this
      # prints the comparison rather than failing on it; see ADR 0004.
      - name: Performance, against this repository's own numbers
        run: |
          python3 tools/gen_dataset.py --out bench/data/http_logs.ndjson --docs 200000 || true
          python3 tools/bench_gate.py || true

      - name: Every acknowledged write survives kill -9
        run: python3 tools/restart_check.py
