name: release

# A release is cut by pushing a tag. Everything here is built from that tag
# and nothing else, so what is published is what the tag says.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'the tag to build, for a dry run'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  # A tag says which version this is; the manifest says which version the
  # binary reports. Nothing was comparing them, so `v0.4.0` could have built a
  # binary that calls itself 0.3.2 and nobody would have noticed until
  # somebody read `--version` on a machine and could not tell which build they
  # had. This is a few seconds, and it runs before anything is built.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag and the manifest say the same version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          want="${tag#v}"
          crate="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          echo "tag [$tag] -> [$want]; manifest [$crate]"
          if [ "$want" != "$crate" ]; then
            echo "::error::the tag says $want and Cargo.toml says $crate"
            exit 1
          fi

  # The gates run again on the tag. A release that was not measured is not a
  # release: the tag may not be the commit the last green run was on.
  # This used to be three commands of its own -- fmt, clippy and the unit
  # tests -- so a tag was cut without the conformance suite, the auth matrix,
  # the refusal check, the fuzzer or the restart check having run on it. It is
  # the same job the branch runs, not a shorter one that reads like it.
  gates:
    needs: version
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # Two builds a release: one carrying the Japanese, Korean and Chinese
      # dictionaries and one without them. They are most of the binary's
      # weight, and a deployment that does not read those scripts should not
      # have to carry them. Each goes to a target directory of its own, so
      # neither can be packaged as the other.
      - name: Build
        run: |
          cargo build --release --bin velosearch \
            --target ${{ matrix.target }} --target-dir target/full
          cargo build --release --bin velosearch --no-default-features \
            --target ${{ matrix.target }} --target-dir target/light
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          package() {
            name="velosearch-${version}-${{ matrix.target }}$2"
            mkdir -p "dist/$name"
            cp "target/$1/${{ matrix.target }}/release/velosearch" "dist/$name/"
            cp README.md LICENSE-APACHE LICENSE-MIT LICENSE-SNOWBALL "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          }
          package full ""
          package light "-nodict"
      # What is in the build, as a document somebody can read: every crate,
      # its version and its licence. A release that ships a binary without one
      # cannot answer "does this contain <the crate in this week's advisory>"
      # except by rebuilding it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx
      - name: Bill of materials
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo cyclonedx --all-features --format json
          mv velosearch.cdx.json "dist/velosearch-${version}-${{ matrix.target }}.cdx.json"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz*
            dist/*.cdx.json

  image:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # what cosign signs with: this workflow's own identity, no key
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # What is in the image that is not this project: the base image's
      # packages. A release that publishes an image with a known critical
      # vulnerability in it should say so before somebody pulls it, not after.
      - name: Scan the image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
        if: startsWith(github.ref, 'refs/tags/')

      # Signed with the workflow's own identity rather than a key somebody
      # holds: `cosign verify` then says which repository, which workflow and
      # which commit produced the image, and there is no key to leak.
      - uses: sigstore/cosign-installer@v3
        if: startsWith(github.ref, 'refs/tags/')
      - name: Sign the image
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

  # the same image, to Google Artifact Registry, tagged with the version
  gcp-image:
    needs: gates
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    needs: [binaries, image]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A draft rather than a published release: somebody reads the notes and
        # the checksums before anybody can download them.
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md \
            dist/*.tar.gz dist/*.sha256
